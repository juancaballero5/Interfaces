<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Stats preview card component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend+Deca&
  display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>

<body>
  <main class="tarjeta">
    <div class="contenido">
      <h1 class="titulo">Get <span class="resaltado">insights</span> that help your business grow.</h1>
      <p class="descripcion">
        Discover the benefits of data analytics and make better decisions regarding
        revenue,
        customer experience, and overall efficiency.
      </p>
      <ul class="estadisticas">
        <li class="dato"><span class="cifra">10k+</span><br> <span class="etiqueta">companies</span></li>
        <li class="dato"><span class="cifra">314</span> <br><span class="etiqueta">templates</span></li>
        <li class="dato"><span class="cifra">12M+</span><br> <span class="etiqueta">queries</span></li>
      </ul>
    </div>
    <div class="imagen">
      <img src="./images/image-header-desktop.jpg" alt="">
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Juan Caballero</a>.
  </footer>
</body>

</html>
