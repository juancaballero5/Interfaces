<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 2</title>
    <style>
        h1 {
            font-size: 5rem;
            font-family: "Roboto", sans-serif;
            font-style: normal;
            text-align: center;
            margin: 50px;
            padding:  40px;
            /* background:linear-gradient(90deg,rgba(237, 76, 12, 1) 36%, rgba(2, 0, 36, 1) 44%, rgba(9, 9, 121, 1) 53%, rgba(0, 212, 255, 1) 61%); */
            background-image: url("./img/image.png");
            background-clip: text;
            color: white;
            -webkit-text-stroke: 14px transparent;
        }
        .galeria {
            width: 100vw;
            height: 280px;
            text-align: center;
            align-content: center;
            background-color: black;
        }
        .galeria img {
            width: 250px;
            border-radius: 10px;
            margin: 5px;
            filter: grayscale(100%) brightness(1.5) saturate(1.3) blur(0.2px);
            transition: 0,85s all;
        }
        .galeria img:hover{
            filter: grayscale(10%) brightness(1) saturate(1);
            box-shadow: 20px 20px 60px #fff;
            width: 260px;
        }
        #imgSombra{
            width: 400px;
            margin: auto;
            /* box-shadow: 2px 2px 2px #a3a2a2; */
            filter: drop-shadow(5px 5px 20px #777676);
        }
        #contenedor {
            align-content: center;
            width: 100vw;
            height: 900px;
            background-image: url("img/image3.png");
            background-size: cover;
        }
        #contenido {
            width: 400px;
            height: 300px;
            margin: 200px auto;
            text-align: center;
            align-content: center;
            color: aliceblue;
            font-size: 3rem;
            border-radius: 50%;
            background-color: rgb(255, 255, 255/ 0.1);
            backdrop-filter: blur(8px);
        }
        #recorte{
            width: 200px;
            height: 200px;
            background-image: url("img/bosque.png");
            background-size: cover;
            margin: auto;
            clip-path: polygon(0 0, 100% 0, 50% 100%,0 0, 100% 0, 50% 100% ,0 0, 100% 0, 50% 100%, 0 100%);
        }
    </style>
</head>
<body>
    <h1>TEXTO CON FONDO DEGRADADO</h1>
    <div class="galeria">
        <img src="./img/image2.png" >
        <img src="./img/image3.png" >
    </div>

    <img id="imgSombra" src="./img/6308.png" >

    <div id="contenedor">

        <div id="contenido">
            TEXTO DE PRUEBA
        </div>

    </div>

    <div id="recorte"></div>

</body>
</html>
